[package]
authors = ["you"]
default-run = "app"
description = "A Tauri App"
edition = "2021"
license = ""
name = "app"
repository = ""
rust-version = "1.90"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
arc-swap = "1.9"
async-trait = "0.1"
chrono = "0.4"
dirs = "7.0"
duckdb = { version = "1.10506", features = ["bundled"] }
nom = "8.0"
regex = "1.13"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tokio = { version = "1.53", default-features = false, features = [
    "time"
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
] }

# Shrink the release binary. Without LTO the linker cannot discard unused code
# across crates, which matters a lot with Tauri 2's ~450-crate tree.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The `cc` crate builds DuckDB using the profile's opt-level, so `opt-level = "s"`
# above would compile the native library with -Os (and a debug build would use
# -O0, making every query in `npm run tauri dev` crawl). Pin the native build to
# a fully optimized one in both profiles; this does not affect the Rust crates.
[profile.dev.package.libduckdb-sys]
opt-level = 3

[profile.release.package.libduckdb-sys]
opt-level = 3
